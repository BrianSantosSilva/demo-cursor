<div class="confirm-modal">
  <h2 class="modal-title">{{ title }}</h2>
  <p class="modal-message">{{ message }}</p>
  
  <div class="modal-actions">
    <button class="btn-cancel" (click)="cancel()">
      Cancelar
    </button>
    <button class="btn-confirm" (click)="confirm()">
      Confirmar
    </button>
  </div>
</div>
